; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Standalone project (independent of the repo's root platformio.ini) for the
; DS18B20 temperature sensor example on M5Stack Tab5. Build with:
;   pio run -d examples/TempSensor
; Upload with:
;   pio run -d examples/TempSensor -t upload --upload-port /dev/ttyACM0
;
; Wiring:
;   3V3 ── DS18B20 VCC
;   GND ── DS18B20 GND
;   G49 ── DS18B20 DATA

[platformio]
src_dir = .
build_cache_dir = ../../.pio/build_cache

; Requires pioarduino platform fork for ESP32-P4 support.
; Note: does not work for version above #55.03.35
[env:m5stack_tab5_tempsensor]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.35
board = esp32-p4-evboard
framework = arduino
build_src_filter = +<*> -<lib/> +<../../src/*.cpp> +<../../src/stations/*.cpp>
build_flags =
  -I ${PROJECT_SRC_DIR}
  -I ${PROJECT_DIR}/../../src
  -I ${PROJECT_DIR}/../../src/stations
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
upload_speed = 1500000
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified @ ^0.2.13
  m5stack/M5GFX @ ^0.2.19
  milesburton/DallasTemperature
  jpb10/SolarCalculator @ ^2.0.2
  paulstoffregen/Time @ ^1.6.1
